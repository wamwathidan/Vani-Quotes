<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vani-Quotes | Devotional Quote Generator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23d35400'/><path d='M50 20 C40 40, 30 50, 50 80 C70 50, 60 40, 50 20 Z' fill='%23f1c40f'/><circle cx='50' cy='52' r='8' fill='%23ffffff'/></svg>">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

   <style>
    /* Reset & Base Styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: #121212;
  color: #ffffff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

/* App Header */
header, h1 {
  text-align: center;
  color: #e67e22;
  margin-bottom: 20px;
}

/* Main Layout Container (Desktop: Side-by-Side) */
.main-container, main, #app {
  display: flex;
  flex-direction: row;
  gap: 24px;
  width: 100%;
  max-width: 1100px;
  align-items: flex-start;
  justify-content: center;
}

/* Settings / Controls Panel */
.controls, .settings-panel, sidebar, form {
  flex: 1;
  min-width: 300px;
  background: #1e1e1e;
  padding: 20px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* Controls Inputs & Buttons */
input, select, textarea, button {
  width: 100%;
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid #333;
  background: #2a2a2a;
  color: #fff;
  font-size: 14px;
}

button {
  background: #e67e22;
  border: none;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s;
}

button:hover {
  background: #d35400;
}

/* Canvas / Preview Container */
.preview-container, .card-wrapper, #quoteCard {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
}

canvas, img#preview {
  max-width: 100%;
  height: auto !important;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

/* Mobile Layout: Stack Settings ON TOP, Canvas BELOW */
@media (max-width: 768px) {
  body {
    padding: 12px;
  }

  .main-container, main, #app {
    flex-direction: column;
    align-items: center;
  }

  .controls, .settings-panel, sidebar, form {
    width: 100%;
    min-width: unset;
  }

  .preview-container, .card-wrapper, #quoteCard {
    width: 100%;
  }
}
  </style>
</head>
<body>

  <div class="controls">
    <div class="brand-header">
      <h1>Vani-Quotes</h1>
      <p>Devotional Quote Card Generator</p>
    </div>
    
    <div class="form-group">
      <label>Template Preset</label>
      <select id="themeSelect">
        <option value="theme-saffron">1. Traditional Saffron</option>
        <option value="theme-parchment">2. Textured Parchment</option>
        <option value="theme-dark">3. Dark Devotional</option>
        <option value="theme-ethereal">4. Ethereal Texture</option>
        <option value="theme-modern">5. Modern Editorial</option>
      </select>
    </div>

    <div class="form-group">
      <label>Srila Prabhupada Photo</label>
      <select id="prabhupadaSelect">
        <option value="assets/Prabhupada/1.jpg">Prabhupada Photo 1</option>
        <option value="assets/Prabhupada/2.jpg">Prabhupada Photo 2</option>
        <option value="assets/Prabhupada/3.jpg">Prabhupada Photo 3</option>
      </select>
    </div>

    <div class="form-group">
      <label>Quote Text</label>
      <textarea id="quoteInput" placeholder="Enter quote here...">By serving the great souls, one attains all success in spiritual life.</textarea>
    </div>

    <div class="form-group">
      <label>Speaker Name</label>
      <input type="text" id="speakerInput" value="HH Maha-Vishnu Swami Maharaj">
    </div>

    <div class="form-group">
      <label>Speaker Photo Preset</label>
      <select id="maharajSelect">
        <option value="assets/Maharaj/m1.jpg">Maharaj Photo 1</option>
        <option value="assets/Maharaj/m2.jpg">Maharaj Photo 2</option>
        <option value="assets/Maharaj/m3.jpg">Maharaj Photo 3</option>
      </select>
    </div>

    <div class="form-group">
      <label>Or Upload Custom Speaker Photo</label>
      <input type="file" id="speakerFileInput" accept="image/*" style="margin-bottom: 4px;">
      <input type="text" id="speakerUrlInput" placeholder="Or paste image URL...">
    </div>

    <div class="form-group"><label>Date</label><input type="text" id="dateInput" placeholder="e.g. Jan 2004"></div>
    <div class="form-group"><label>Location</label><input type="text" id="locInput" placeholder="e.g. Singapore"></div>
    <div class="form-group"><label>Source</label><input type="text" id="sourceInput" placeholder="e.g. Srimad Bhagavatam"></div>

    <div class="button-group">
      <button class="btn btn-download" id="downloadBtn">Download PNG</button>
      <button class="btn btn-share" id="shareBtn">Share Card</button>
    </div>
  </div>

  <div class="workspace">
    <div id="quote-card" class="theme-saffron">
      <div id="cardContent" style="width:100%; height:100%; display:flex; flex-direction:inherit; justify-content:inherit; align-items:inherit;"></div>
    </div>
  </div>

  <script>
    const quoteInput = document.getElementById('quoteInput');
    const speakerInput = document.getElementById('speakerInput');
    const speakerFileInput = document.getElementById('speakerFileInput');
    const speakerUrlInput = document.getElementById('speakerUrlInput');
    const prabhupadaSelect = document.getElementById('prabhupadaSelect');
    const maharajSelect = document.getElementById('maharajSelect');
    const dateInput = document.getElementById('dateInput');
    const locInput = document.getElementById('locInput');
    const sourceInput = document.getElementById('sourceInput');
    const themeSelect = document.getElementById('themeSelect');
    const quoteCard = document.getElementById('quote-card');
    const cardContent = document.getElementById('cardContent');

    let activeSpeakerImage = maharajSelect.value;
    let activePrabhupadaImage = prabhupadaSelect.value;

    prabhupadaSelect.addEventListener('change', () => {
      activePrabhupadaImage = prabhupadaSelect.value;
      renderCard();
    });

    maharajSelect.addEventListener('change', () => {
      activeSpeakerImage = maharajSelect.value;
      speakerFileInput.value = '';
      speakerUrlInput.value = '';
      renderCard();
    });

    speakerFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          activeSpeakerImage = evt.target.result;
          speakerUrlInput.value = '';
          renderCard();
        };
        reader.readAsDataURL(file);
      }
    });

    speakerUrlInput.addEventListener('input', () => {
      if (speakerUrlInput.value.trim()) {
        activeSpeakerImage = speakerUrlInput.value.trim();
        speakerFileInput.value = '';
        renderCard();
      }
    });

    function adjustFontSize() {
      const quoteDisplay = document.getElementById('quoteDisplay');
      if (!quoteDisplay) return;
      const box = quoteDisplay.parentElement;

      let fontSize = 38;
      quoteDisplay.style.fontSize = fontSize + 'px';

      while ((box.scrollHeight > box.clientHeight || box.scrollWidth > box.clientWidth) && fontSize > 8) {
        fontSize -= 0.5;
        quoteDisplay.style.fontSize = fontSize + 'px';
      }
    }

    function renderCard() {
      const theme = themeSelect.value;
      quoteCard.className = theme;

      const metaArr = [dateInput.value.trim(), locInput.value.trim(), sourceInput.value.trim()].filter(Boolean);
      const metaText = metaArr.join(' • ');
      const quoteText = `"${quoteInput.value.trim()}"`;
      const speakerName = speakerInput.value.trim();

      const prabhupadaBlock = `
        <div class="prabhupada-container">
          <span class="subtle-header">In service of</span>
          <img src="${activePrabhupadaImage}" class="prabhupada-img" alt="Srila Prabhupada">
          <span class="prabhupada-title">HDG Srila A.C. Bhaktivedanta Swami Prabhupada</span>
        </div>
      `;

      const speakerBlock = `
        <div class="speaker-info">
          ${activeSpeakerImage ? `<img src="${activeSpeakerImage}" class="speaker-img" alt="Speaker">` : ''}
          <div class="speaker-details">
            <div class="speaker-name">${speakerName}</div>
            ${metaText ? `<div class="metadata-line">${metaText}</div>` : ''}
          </div>
        </div>
      `;

      const quoteBlock = `<div class="quote-box"><div id="quoteDisplay" class="quote-text">${quoteText}</div></div>`;

      if (theme === 'theme-saffron' || theme === 'theme-modern') {
        cardContent.innerHTML = prabhupadaBlock + quoteBlock + speakerBlock;
      } else {
        cardContent.innerHTML = speakerBlock + quoteBlock + prabhupadaBlock;
      }

      requestAnimationFrame(adjustFontSize);
    }

    async function generateCanvas() {
      return await html2canvas(quoteCard, { useCORS: true, scale: 2 });
    }

    document.getElementById('downloadBtn').addEventListener('click', async () => {
      const canvas = await generateCanvas();
      const link = document.createElement('a');
      link.download = 'vani-ashraya-quote.jpg';
      link.href = canvas.toDataURL('image/jpeg', 0.85);
      link.click();
    });

    document.getElementById('shareBtn').addEventListener('click', async () => {
      const canvas = await generateCanvas();
      canvas.toBlob(async (blob) => {
        const file = new File([blob], 'quote.jpg', { type: 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Vani-Ashraya Quote',
              text: quoteInput.value
            });
          } catch (err) {
            console.log('Sharing canceled', err);
          }
        } else {
          alert('Native sharing is not supported on this browser. Use Download instead.');
        }
      }, 'image/jpeg', 0.85);
    });

    [quoteInput, speakerInput, dateInput, locInput, sourceInput].forEach(el => el.addEventListener('input', renderCard));
    themeSelect.addEventListener('change', renderCard);
    renderCard();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.error('PWA registration failed:', err));
    }
  </script>
</body>
</html>
